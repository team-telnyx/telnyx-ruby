name: CI
on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'next'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

jobs:
  classify-production-ci:
    name: classify production CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/classify_production_ci.py --event-path "$GITHUB_EVENT_PATH"

  lint-rubocop:
    needs: classify-production-ci
    timeout-minutes: 10
    name: lint (rubocop)
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate CI runner policy
        run: |-
          python3 .github/scripts/test_ci_runner_policy.py
          python3 .github/scripts/test_run_steep_shard.py
          python3 .github/scripts/test_run_steep_shards.py
          python3 .github/scripts/test_release_pr_auto_merge.py -v
          python3 .github/scripts/test_release_pr_ci_gate.py -v
          python3 .github/scripts/test_classify_production_ci.py -v
          python3 .github/scripts/test_validate_next_provenance.py -v
          python3 .github/scripts/test_verify_rubygems_release.py -v
      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          bundler-cache: false
      - run: |-
          bundle install
      - name: Run rubocop
        run: bundle exec rake lint:rubocop

  lint-steep:
    needs: classify-production-ci
    timeout-minutes: 60
    name: lint (steep)
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out CI orchestration
        if: github.repository == 'team-telnyx/telnyx-ruby' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run production Steep workers
        if: github.repository == 'team-telnyx/telnyx-ruby' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CORRELATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          PRIMARY_WORKER_REF: ci/steep-workers
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: python3 .github/scripts/run_steep_shards.py
      - name: Run fork-safe production Steep check
        if: github.repository == 'team-telnyx/telnyx-ruby' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Ruby for fork-safe check
        if: github.repository == 'team-telnyx/telnyx-ruby' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          bundler-cache: false
      - name: Run fork-safe production Steep check
        if: github.repository == 'team-telnyx/telnyx-ruby' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |-
          bundle install
          bundle exec steep check --jobs=2

  lint-sorbet:
    needs: classify-production-ci
    timeout-minutes: 20
    name: lint (sorbet)
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          bundler-cache: false
      - run: |-
          bundle install
      - name: Run sorbet
        run: bundle exec rake typecheck:sorbet

  test:
    needs: classify-production-ci
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Ruby
        uses: ruby/setup-ruby@c4e5b1316158f92e3d49443a9d58b31d25ac0f8f # v1.306.0
        with:
          bundler-cache: false
      - run: |-
          bundle install

      - name: Run tests
        run: ./scripts/test
